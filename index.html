<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Penyusun Soal PAS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sticky brand bar, left step rail on laptop / bottom tabs on phone, one working column plus live summary. */
:root{
  --blue:#1560b0; --blue-dk:#0b3a73; --orange:#f26b1d; --orange-dk:#c94f0a;
  --bg:#f2f6fb; --surface:#ffffff; --surface2:#eaf1f9; --fg:#0e2238; --muted:#5a6f87; --line:#d5e0ec;
  --ok:#1a7f4b; --warn:#b45309; --err:#c0262d; --on-blue:#ffffff; --tint:#e3eefb; --shadow:0 1px 2px rgba(11,58,115,.08),0 4px 14px rgba(11,58,115,.06);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --blue:#5aa2ee; --blue-dk:#0a1c33; --orange:#ff8a45; --orange-dk:#ff8a45;
  --bg:#0a1626; --surface:#102238; --surface2:#16304d; --fg:#e8f0fa; --muted:#93a8c0; --line:#243d5c;
  --ok:#4cc38a; --warn:#f0a94a; --err:#ff7a80; --on-blue:#06182c; --tint:#16304d; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#5aa2ee; --blue-dk:#0a1c33; --orange:#ff8a45; --orange-dk:#ff8a45;
  --bg:#0a1626; --surface:#102238; --surface2:#16304d; --fg:#e8f0fa; --muted:#93a8c0; --line:#243d5c;
  --ok:#4cc38a; --warn:#f0a94a; --err:#ff7a80; --on-blue:#06182c; --tint:#16304d; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#0b3a73}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto}
/* brand bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0b3a73;color:#fff;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:3px solid var(--orange)}
.bar .wrap{display:flex;align-items:center;gap:12px}
.bar img{width:44px;height:auto;flex:none}
.bar .t{min-width:0}
.bar .t b{display:block;font-size:16px;font-weight:800;letter-spacing:.01em}
.bar .t span{display:block;font-size:12px;opacity:.8}
.bar .sp{flex:1}
.bar .themebtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
/* steps */
.steps{display:flex;gap:6px;margin:16px 0;overflow-x:auto;padding-bottom:2px}
.steps button{flex:1 0 auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.steps button i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface2);font-size:12px;font-weight:800}
.steps button[aria-current="step"]{border-color:var(--blue);color:var(--fg);box-shadow:inset 0 -3px 0 var(--orange)}
.steps button[aria-current="step"] i{background:var(--blue);color:var(--on-blue)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:20px;font-weight:800;color:var(--blue-dk)}
:root[data-theme="dark"] .panel h2{color:var(--fg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .panel h2{color:var(--fg)}}
.lead{color:var(--muted);margin:4px 0 16px}
.f{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.f .full{grid-column:1/-1}
@media(max-width:560px){.f{grid-template-columns:1fr}}
label.l{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;color:var(--fg);min-width:0}
textarea{resize:vertical;min-height:70px}
input,select,textarea{font-weight:400}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:var(--on-blue)}
.btn.or{background:var(--orange);color:#fff}
:root[data-theme="dark"] .btn.or{color:#2a1200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.or{color:#2a1200}}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* case card */
.case{border:1px solid var(--line);border-radius:12px;margin-top:16px;background:var(--surface);overflow:hidden}
.case>header{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--tint);border-bottom:1px solid var(--line)}
.case>header b{font-weight:800;color:var(--blue-dk)}
:root[data-theme="dark"] .case>header b{color:var(--fg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .case>header b{color:var(--fg)}}
.case>header .sp{flex:1}
.case .body{padding:14px;display:grid;gap:12px}
.hint{font-size:12.5px;color:var(--muted)}
.prev{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:14px;overflow-x:auto}
.prev table{border-collapse:collapse;margin:6px 0}
.prev td,.prev th{border:1px solid var(--line);padding:4px 10px;text-align:left}
.prev th{background:var(--tint)}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.q .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q .no{font-weight:800;background:var(--blue);color:var(--on-blue);border-radius:6px;padding:2px 9px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--orange);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed=true]{color:#2a1200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed=true]{color:#2a1200}}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:8px;align-items:center}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:800;cursor:pointer;color:var(--muted)}
.opt .k.on{background:var(--ok);border-color:var(--ok);color:#fff}
.opt input{flex:1}
.mini{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.mini label{display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600}
.tag{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--surface2);color:var(--muted)}
.tag.T1{background:#dcf3e6;color:#14693f}.tag.T2{background:#fdebd0;color:#8a4b06}.tag.T3{background:#fbdcdc;color:#9d1f26}
/* summary */
.side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));display:grid;gap:14px}
@media(max-width:900px){.side{position:static}}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--tint);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue-dk)}
:root[data-theme="dark"] .stat b{color:var(--fg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat b{color:var(--fg)}}
.stat span{font-size:12px;color:var(--muted)}
.mix{display:grid;gap:6px;font-size:13px}
.mix .r{display:grid;grid-template-columns:70px 1fr 28px;gap:8px;align-items:center}
.mix .bar2{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.mix .bar2 i{display:block;height:100%;background:var(--blue)}
.issues{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px}
.issues li{padding:7px 10px;border-radius:8px;background:var(--surface2)}
.issues li.bad{border-left:3px solid var(--err)}
.issues li.good{border-left:3px solid var(--ok)}
.exports{display:grid;gap:10px}
.ex{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.ex .ic{flex:none;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:12px}
.ex .tx{flex:1;min-width:0}.ex .tx b{display:block}.ex .tx span{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--blue-dk);color:#fff;padding:10px 16px;border-radius:10px;z-index:40;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.empty{text-align:center;padding:28px 12px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin-top:16px}
.imgbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgbox img{max-height:90px;max-width:160px;border:1px solid var(--line);border-radius:6px;background:#fff}
.guide{display:grid;gap:8px;margin:0;padding-left:18px;color:var(--fg)}
.footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12px}
.confirm{background:var(--surface2);border:1px solid var(--err);border-radius:10px;padding:12px;margin-top:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
const STEPS=['Identitas','Bantuan AI','Soal','Unduh'];
const TIPE=['PG','CEKLIS','ISIAN','URAIAN','UNGGAH'];
const TIPE_LBL={PG:'Pilihan Ganda',CEKLIS:'Ceklis (jawaban banyak)',ISIAN:'Isian Angka',URAIAN:'Uraian',UNGGAH:'Unggah Tautan Hasil Kerja'};
const LET=['A','B','C','D','E'];
const KEY='ptk-soal-pas-v1';
let S={step:0,meta:{mapel:'',kelas:'',guru:'',batas:'',kirim:''},cases:[],ai:{mapel:'',kelas:'',topik:'',kasus:2,perKasus:3,tipe:{PG:true,CEKLIS:false,ISIAN:true,URAIAN:true,UNGGAH:false},gambar:true,catatan:'',paste:''}};
let PARSED=null;
let confirmReset=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let uid=0;const nid=()=>'i'+Date.now().toString(36)+(uid++);

function newQ(){return{id:nid(),tahap:'T1',tipe:'PG',tanya:'',opts:['','','','',''],kunci:[],isi:'',poin:2,alasan:false,bukti:false,rubrik:''}}
function newCase(){return{id:nid(),bagian:'',kasus:'',img:null,qs:[newQ()]}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.cases){const ai0=S.ai;S=Object.assign(S,d);S.ai=Object.assign({},ai0,d.ai||{});S.ai.tipe=Object.assign({},ai0.tipe,(d.ai&&d.ai.tipe)||{});S.step=0}}}catch(e){}}
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},300)}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}

/* ---------- data helpers ---------- */
function allQ(){const a=[];S.cases.forEach((c,ci)=>c.qs.forEach((q,qi)=>a.push({c,q,ci,qi})));return a}
function kunciText(q){
  if(q.tipe==='PG')return q.kunci[0]||'';
  if(q.tipe==='CEKLIS')return LET.filter(l=>q.kunci.includes(l)).join(', ');
  if(q.tipe==='ISIAN')return String(q.isi||'').trim();
  if(q.tipe==='URAIAN')return 'Lihat rubrik';
  return '';
}
function optCount(q){return q.opts.filter(o=>o.trim()).length}
function issues(){
  const out=[];const all=allQ();
  if(!S.meta.mapel.trim())out.push('Isi mata pelajaran di langkah Identitas.');
  if(!all.length)out.push('Belum ada soal.');
  all.forEach(({c,q,ci,qi})=>{
    const n=`Kasus ${ci+1}, soal ${qi+1}`;
    if(!q.tanya.trim())out.push(`${n}: pertanyaan masih kosong.`);
    if(q.tipe==='PG'||q.tipe==='CEKLIS'){
      if(optCount(q)<2)out.push(`${n}: minimal 2 pilihan jawaban.`);
      if(!q.kunci.length)out.push(`${n}: kunci belum dipilih.`);
      else if(q.kunci.some(k=>!q.opts[LET.indexOf(k)].trim()))out.push(`${n}: kunci menunjuk pilihan yang kosong.`);
    }
    if(q.tipe==='ISIAN'&&!String(q.isi).trim())out.push(`${n}: jawaban benar belum diisi.`);
    if(q.tipe==='ISIAN'&&String(q.isi).trim()&&!/^-?[\d.,]+$/.test(String(q.isi).trim()))out.push(`${n}: jawaban isian harus angka saja.`);
    if(q.tipe==='URAIAN'&&!q.rubrik.trim())out.push(`${n}: rubrik penilaian uraian belum diisi.`);
    if(!(Number(q.poin)>0))out.push(`${n}: poin harus lebih dari 0.`);
  });
  return out;
}
function rows(){
  const imgNames=new Map();let g=0;S.cases.forEach(c=>{if(c.img)imgNames.set(c.id,'Gambar'+(++g))});
  const r=[];
  S.cases.forEach(c=>c.qs.forEach((q,qi)=>{
    r.push([c.bagian,qi===0?c.kasus:'',q.tahap,q.tipe,q.tanya,...q.opts.map((o,i)=>(q.tipe==='PG'||q.tipe==='CEKLIS')?o:''),kunciText(q),String(q.poin),q.alasan?'Ya':'Tidak',q.bukti?'Ya':'Tidak',(qi===0&&c.img)?imgNames.get(c.id):'',q.rubrik]);
  }));
  return {rows:r,imgNames};
}
const HEAD=['Bagian','Kasus','Tahap','Tipe','Pertanyaan','Pilihan A','Pilihan B','Pilihan C','Pilihan D','Pilihan E','Kunci','Poin','Alasan','Bukti','Catatan Gambar','Rubrik'];

/* ---------- render ---------- */
function render(){
  $('#steps').innerHTML=STEPS.map((s,i)=>`<button type="button" data-step="${i}" ${i===S.step?'aria-current="step"':''}><i>${i+1}</i>${s}</button>`).join('');
  const m=$('#main');
  if(S.step===0)m.innerHTML=viewMeta();
  else if(S.step===1)m.innerHTML=viewAI();
  else if(S.step===2)m.innerHTML=viewSoal();
  else m.innerHTML=viewExport();
  renderSide();
  if(S.step===2)document.querySelectorAll('[data-prev]').forEach(el=>el.innerHTML=prevHtml(el.dataset.prev));
}
function viewMeta(){
  const M=S.meta;
  return `<section class="panel"><h2>Identitas soal</h2><p class="lead">Isi sekali, dipakai di semua file yang diunduh.</p>
  <div class="f">
   <label class="l full">Mata pelajaran<input type="text" id="m_mapel" value="${esc(M.mapel)}" placeholder="Contoh: Kewirausahaan"></label>

function viewSoal(){

    <button class="btn ghost sm" data-act="cDown" type="button" ${ci===S.cases.length-1?'disabled':''} aria-label="Turunkan kasus">↓</button>

    <label class="l">Teks kasus atau data (boleh kosong)<textarea data-f="kasus" rows="5" placeholder="Tulis bacaan atau data. Tabel kecil: satu baris per baris tabel, kolom dipisah tanda |">${esc(c.kasus)}</textarea></label>

   ${hasOpt?`<div><div class="hint" style="margin-bottom:6px">${q.tipe==='PG'?'Isi pilihan, lalu klik huruf bulat untuk kunci (satu jawaban).':'Isi pilihan, lalu klik semua huruf yang benar.'}</div><div class="opts">
     ${LET.map((l,i)=>`<div class="opt"><button type="button" class="k ${q.kunci.includes(l)?'on':''}" data-act="key" data-v="${l}" aria-pressed="${q.kunci.includes(l)}" aria-label="Kunci ${l}">${l}</button><input type="text" data-opt="${i}" value="${esc(q.opts[i])}" placeholder="Pilihan ${l}${i>=4?' (opsional)':''}"></div>`).join('')}</div></div>`:''}
   ${q.tipe==='ISIAN'?`<label class="l">Jawaban benar (angka saja)<input type="text" inputmode="decimal" data-f="isi" value="${esc(q.isi)}" placeholder="Contoh: 556"></label>`:''}
   ${q.tipe==='UNGGAH'?`<p class="hint" style="margin:0">Siswa menempel tautan foto atau hasil kerja. Tidak ada kunci otomatis.</p>`:''}
   ${(q.tipe==='URAIAN'||q.tipe==='ISIAN'||q.tipe==='UNGGAH'||hasOpt)?`<label class="l">${q.tipe==='URAIAN'?'Rubrik penilaian (wajib)':'Pembahasan atau rubrik (opsional)'}<textarea data-f="rubrik" rows="2" placeholder="${q.tipe==='URAIAN'?'Contoh: 3 poin langkah benar, 2 poin hasil akhir':'Contoh: 6.000 + 1.000 + 2.000 = 9.000'}">${esc(q.rubrik)}</textarea></label>`:''}
   <div class="mini"><label><input type="checkbox" data-f="alasan" ${q.alasan?'checked':''}> Siswa wajib menjelaskan alasan</label><label><input type="checkbox" data-f="bukti" ${q.bukti?'checked':''}> Siswa wajib menempel tautan bukti</label></div>
  </div>`;
}
function prevHtml(id){
  const c=S.cases.find(x=>x.id===id);if(!c||!c.kasus.trim())return '<span class="hint">Pratinjau kasus akan tampil di sini.</span>';
  const lines=c.kasus.split('\n');let out='',tbl=[];
  const flush=()=>{if(tbl.length){out+='<table>'+tbl.map((r,i)=>'<tr>'+r.map(x=>`<${i?'td':'th'}>${esc(x)}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table>';tbl=[]}};
  lines.forEach(l=>{if(l.includes('|'))tbl.push(l.split('|').map(x=>x.trim()));else{flush();if(l.trim())out+=`<div>${esc(l)}</div>`}});
  flush();return out;
}
function renderSide(){

   <div class="mix" style="margin-top:14px">${[['T1','Mudah'],['T2','Sedang'],['T3','Sulit']].map(([k,n])=>`<div class="r"><span>${k} ${n}</span><div class="bar2"><i style="width:${cnt[k]/mx*100}%"></i></div><b>${cnt[k]}</b></div>`).join('')}</div>
   <div class="hint" style="margin-top:10px">${TIPE.filter(t=>tc[t]).map(t=>`${t} ${tc[t]}`).join(' · ')||'Belum ada tipe soal'}</div></section>
   <section class="panel"><h3 style="font-size:15px;margin-bottom:10px">Pemeriksaan</h3>
   <ul class="issues">${iss.length?iss.slice(0,8).map(i=>`<li class="bad">${esc(i)}</li>`).join('')+(iss.length>8?`<li>…dan ${iss.length-8} catatan lain</li>`:''):'<li class="good">Semua soal lengkap dan siap diunduh.</li>'}</ul></section>`;

/* ---------- events ---------- */
function find(el){const ce=el.closest('[data-c]');const qe=el.closest('[data-q]');const c=ce&&S.cases.find(x=>x.id===ce.dataset.c);const q=qe&&c&&c.qs.find(x=>x.id===qe.dataset.q);return{c,q}}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id&&t.id.startsWith('m_')){S.meta[t.id.slice(2)]=t.value;save();return}
  if(t.dataset.ai){const k=t.dataset.ai;if(k.startsWith('tipe.'))S.ai.tipe[k.slice(5)]=t.checked;else if(t.type==='checkbox')S.ai[k]=t.checked;else if(t.type==='number')S.ai[k]=Math.max(1,Math.min(10,parseInt(t.value)||1));else S.ai[k]=t.value;save();if(k!=='paste'){const o=document.getElementById('promptOut');if(o)o.value=buildPrompt()}return}
  const {c,q}=find(t);
  if(t.dataset.opt!==undefined&&q){q.opts[+t.dataset.opt]=t.value;save();renderSide();return}
  const f=t.dataset.f;if(!f||!c)return;
  if(t.type==='checkbox'){return}
  const tgt=(f==='bagian'||f==='kasus')?c:q;if(!tgt)return;
  if(f==='tipe')return;
  tgt[f]=t.value;
  if(f==='kasus'){const p=document.querySelector(`[data-prev="${c.id}"]`);if(p)p.innerHTML=prevHtml(c.id)}
  save();renderSide();
});
document.addEventListener('change',e=>{
  const t=e.target;const {c,q}=find(t);
  if(t.dataset.f==='tipe'&&q){q.tipe=t.value;if(q.tipe==='PG')q.kunci=q.kunci.slice(0,1);if(q.tipe!=='PG'&&q.tipe!=='CEKLIS')q.kunci=[];if(q.tipe==='URAIAN')q.poin=Math.max(q.poin,5);save();render();return}
  if((t.dataset.f==='alasan'||t.dataset.f==='bukti')&&q){q[t.dataset.f]=t.checked;save();return}
  if(t.dataset.act==='img'&&c&&t.files[0])readImg(c,t.files[0]);
  if(t.dataset.act==='openJson'&&t.files[0])openJson(t.files[0]);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-go],[data-step]');if(!b)return;
  if(b.id==='themeBtn'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';return}
  if(b.dataset.step!==undefined){go(+b.dataset.step);return}
  if(b.dataset.go){go(+b.dataset.go);return}
  if(b.dataset.exp){exportAs(b.dataset.exp);return}
  if(b.dataset.cp){const r0=rows().rows;const k=b.dataset.cp;if(k==='word')copyAny(tsv(r0),'Tabel',tableHtml(r0));else if(k==='sheet')copyAny(tsv(r0),'Data');else copyAny(gas(r0),'Skrip');return}
  const a=b.dataset.act;if(!a)return;
  const {c,q}=find(b);
  const mv=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]};
  if(a==='addCase'){S.cases.push(newCase());save();render();requestAnimationFrame(()=>{const els=document.querySelectorAll('.case');els[els.length-1]?.scrollIntoView({behavior:'smooth',block:'start'})});return}
  if(a==='sample'){loadSample();return}
  if(a==='copyPrompt'){copyText(buildPrompt());return}
  if(a==='samplePaste'){S.ai.paste=SAMPLE_AI;PARSED=null;save();render();return}
  if(a==='clearPaste'){S.ai.paste='';PARSED=null;save();render();return}
  if(a==='parseAI'){runParse();return}
  if(a==='addParsed'){addParsed();return}
  if(a==='reset'){confirmReset=true;render();return}
  if(a==='resetNo'){confirmReset=false;render();return}
  if(a==='resetYes'){S=Object.assign(S,{step:3,meta:{mapel:'',kelas:'',guru:'',batas:'',kirim:''},cases:[]});confirmReset=false;save();render();toast('Semua soal dihapus');return}
  if(!c)return;
  const ci=S.cases.indexOf(c);
  if(a==='cDel'){S.cases.splice(ci,1)}
  else if(a==='cUp')mv(S.cases,ci,-1);
  else if(a==='cDown')mv(S.cases,ci,1);
  else if(a==='addQ'){const last=c.qs[c.qs.length-1];const n=newQ();if(last){n.tahap=last.tahap}c.qs.push(n)}
  else if(a==='imgDel')c.img=null;
  else if(a==='tbl'){c.kasus=(c.kasus.trim()?c.kasus.replace(/\s+$/,'')+'\n':'')+'Komponen | Biaya (Rp)\nBahan baku | 6000\nKemasan | 1000\n';}
  else if(q){
    const qi=c.qs.indexOf(q);
    if(a==='qDel'){if(c.qs.length>1)c.qs.splice(qi,1);else{toast('Kasus harus punya minimal satu soal');return}}
    else if(a==='qUp')mv(c.qs,qi,-1);
    else if(a==='qDown')mv(c.qs,qi,1);
    else if(a==='qDup'){const d=JSON.parse(JSON.stringify(q));d.id=nid();c.qs.splice(qi+1,0,d)}
    else if(a==='tahap')q.tahap=b.dataset.v;
    else if(a==='key'){const l=b.dataset.v;if(q.tipe==='PG')q.kunci=q.kunci[0]===l?[]:[l];else q.kunci=q.kunci.includes(l)?q.kunci.filter(x=>x!==l):[...q.kunci,l]}
    else return;
  } else return;
  save();const y=scrollY;render();scrollTo(0,y);
});
function go(i){if(i!==1)PARSED=PARSED;S.step=i;confirmReset=false;render();scrollTo({top:0,behavior:'smooth'})}
function readImg(c,file){
  if(file.size>3*1024*1024){toast('Gambar maksimal 3 MB');return}
  const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
    const maxW=900;const sc=Math.min(1,maxW/im.width);const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
    const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);
    c.img={url:cv.toDataURL('image/jpeg',.85),w:cv.width,h:cv.height};save();render()};im.onerror=()=>toast('File gambar tidak bisa dibaca');im.src=fr.result};fr.readAsDataURL(file);
}
function openJson(f){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.cases)throw 0;S=Object.assign(S,d,{step:2});S.ai=Object.assign({},S.ai,d.ai||{});S.meta=Object.assign({mapel:'',kelas:'',guru:'',batas:'',kirim:''},S.meta);save();render();toast('Proyek dibuka')}catch(e){toast('File proyek tidak valid')}};fr.readAsText(f)}
function loadSample(){
  S.meta=Object.assign(S.meta,{mapel:S.meta.mapel||'Kewirausahaan'});
  S.cases.push({id:nid(),bagian:'A. Keputusan Usaha',kasus:'Rina membuat keripik pisang. Rincian biaya per bungkus:\nKomponen | Biaya (Rp)\nBahan baku | 6000\nKemasan | 1000\nUpah | 2000\nHarga jual Rp12.000 per bungkus; target laba Rp1.000.000 per bulan. Harga bahan naik 20%.',img:null,qs:[
   {id:nid(),tahap:'T1',tipe:'ISIAN',tanya:'Berapa HPP per bungkus sebelum harga bahan naik? (angka saja)',opts:['','','','',''],kunci:[],isi:'9000',poin:3,alasan:false,bukti:false,rubrik:'6.000 + 1.000 + 2.000 = 9.000'},
   {id:nid(),tahap:'T2',tipe:'ISIAN',tanya:'Setelah bahan naik 20%, minimal berapa bungkus terjual per bulan agar target laba tercapai? (angka saja, dibulatkan ke atas)',opts:['','','','',''],kunci:[],isi:'556',poin:5,alasan:false,bukti:true,rubrik:'HPP 10.200; laba 1.800; 1.000.000 / 1.800 = 556'},
   {id:nid(),tahap:'T3',tipe:'PG',tanya:'Keputusan terbaik jika harga jual tetap dan target laba harus tercapai adalah ....',opts:['Menjual 334 bungkus','Menjual 556 bungkus','Menjual 300 bungkus','Menurunkan kualitas bahan',''],kunci:['B'],isi:'',poin:5,alasan:true,bukti:false,rubrik:''}]});
  save();render();toast('Contoh dimuat. Silakan ubah atau hapus.');

  try{const blob=(data instanceof Blob)?data:(typeof data==='string'?new Blob([data],{type:'text/plain;charset=utf-8'}):new Blob([data]));const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Tersimpan: '+name);setMsg('Tersimpan: '+name,true)}catch(e){setMsg('Gagal menyimpan: '+(e&&e.message||e)+'. Pakai bagian "Jika unduhan tidak jalan" di bawah.')}

  if(k==='xlsx'){

async function buildDocx(r,imgNames){
  const D=window.docx;const M=S.meta;
  const NAVY='0B3A73',BLUE='1560B0',OR='F26B1D';
  const p=(t,o={})=>new D.Paragraph({spacing:{after:o.after??60},alignment:o.al,children:[new D.TextRun({text:t,bold:o.b,size:o.sz||20,color:o.c,font:'Calibri'})]});
  const cell=(txt,o={})=>{
    const lines=String(txt??'').split('\n');
    return new D.TableCell({width:{size:o.w,type:D.WidthType.DXA},shading:o.fill?{type:D.ShadingType.CLEAR,fill:o.fill,color:'auto'}:undefined,margins:{top:50,bottom:50,left:70,right:70},
      children:[new D.Paragraph({children:lines.flatMap((l,i)=>[new D.TextRun({text:l,bold:o.b,color:o.c,size:o.sz||16,font:'Calibri',break:i?1:0})])})]});
  };
  const W=[1200,2000,450,650,2200,800,800,800,800,800,550,450,550,550,750,1450];
  const sum=W.reduce((a,b)=>a+b,0);
  const tbl=new D.Table({width:{size:sum,type:D.WidthType.DXA},columnWidths:W,rows:[
    new D.TableRow({tableHeader:true,children:HEAD.map((h,i)=>cell(h,{w:W[i],b:true,fill:NAVY,c:'FFFFFF'}))}),
    ...r.map((row,ri)=>new D.TableRow({cantSplit:true,children:row.map((v,i)=>cell(v,{w:W[i],fill:ri%2?'EAF1F9':undefined}))}))]});
  const kids=[
    p('FORMAT SOAL PAS',{b:true,sz:32,c:NAVY,after:40}),
    p('SMK Taruna Karya · Kab. Tangerang',{c:OR,b:true,sz:20,after:120}),
    p(`Mata pelajaran: ${M.mapel||'-'}     Kelas: ${M.kelas||'-'}     Nama guru: ${M.guru||'-'}`,{sz:21}),
    p(`Batas pengumpulan: ${M.batas||'-'}     Kirim ke: ${M.kirim||'-'}`,{sz:21,after:160}),
    p('TABEL ISIAN SOAL',{b:true,sz:24,c:BLUE,after:80}),tbl];
  const withImg=S.cases.filter(c=>c.img);
  if(withImg.length){
    kids.push(new D.Paragraph({pageBreakBefore:true,spacing:{after:80},children:[new D.TextRun({text:'LAMPIRAN GAMBAR',bold:true,size:24,color:BLUE,font:'Calibri'})]}));
    const rowsImg=[new D.TableRow({children:[cell('Nama gambar',{w:2000,b:true,fill:NAVY,c:'FFFFFF',sz:20}),cell('Gambar',{w:9000,b:true,fill:NAVY,c:'FFFFFF',sz:20})]})];
    for(const c of withImg){
      const bin=atob(c.img.url.split(',')[1]);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      const w=Math.min(420,c.img.w),h=Math.round(w*c.img.h/c.img.w);
      rowsImg.push(new D.TableRow({children:[cell(imgNames.get(c.id),{w:2000,sz:20}),new D.TableCell({width:{size:9000,type:D.WidthType.DXA},margins:{top:80,bottom:80,left:80,right:80},children:[new D.Paragraph({children:[new D.ImageRun({data:u8,transformation:{width:w,height:h}})]})]})]}));
    }
    kids.push(new D.Table({width:{size:11000,type:D.WidthType.DXA},columnWidths:[2000,9000],rows:rowsImg}));
  }
  const doc=new D.Document({creator:'SMK Taruna Karya',title:'Soal PAS '+(M.mapel||''),sections:[{properties:{page:{size:{orientation:D.PageOrientation.LANDSCAPE,width:11906,height:16838},margin:{top:720,bottom:720,left:600,right:600}}},children:kids}]});
  return D.Packer.toBlob(doc);
}

     <div class="prev" data-p="${i}">${prevHtmlText(c.kasus)}</div>
     ${c.qs.map((q,j)=>`<div class="hint"><span class="tag ${q.tahap}">${q.tahap}</span> <b>${q.tipe}</b> ${esc(q.tanya.slice(0,110))}${q.tanya.length>110?'…':''} · kunci: ${esc(kunciText(q)||'-')} · ${q.poin} poin</div>`).join('')}</div>`).join('')}</div>
   <div class="row" style="margin-top:12px"><button class="btn or" data-act="addParsed" type="button">Tambahkan ${nq} soal ke daftar</button></div></div>`;
}
function prevHtmlText(txt){
  const lines=String(txt||'').split('\n');let out='',tbl=[];
  const flush=()=>{if(tbl.length){out+='<table>'+tbl.map((r,i)=>'<tr>'+r.map(x=>`<${i?'td':'th'}>${esc(x)}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table>';tbl=[]}};
  lines.forEach(l=>{if(l.includes('|'))tbl.push(l.split('|').map(x=>x.trim()));else{flush();if(l.trim())out+=`<div>${esc(l)}</div>`}});
  flush();return out||'<span class="hint">Tanpa teks kasus.</span>';
}
function parseAI(raw){
  const warns=[];let text=String(raw||'').replace(/\r/g,'').replace(/\*\*/g,'');
  const lines=text.split('\n').filter(l=>!/^\s*```/.test(l));
  const cases=[];let c=null,q=null,field=null,svgBuf=null;
  const newCase=()=>{c={id:nid(),bagian:'',kasus:'',img:null,svg:'',imgNote:'',qs:[]};cases.push(c);q=null;field=null};
  const newQ=()=>{if(!c)newCase();q=Object.assign(newQ0(),{_set:{}});c.qs.push(q);field=null};
  const newQ0=()=>({id:nid(),tahap:'T1',tipe:'PG',tanya:'',opts:['','','','',''],kunci:[],isi:'',poin:0,alasan:false,bukti:false,rubrik:'',_k:''});
  const KEYS='BAGIAN|TEKS|GAMBAR_DESKRIPSI|GAMBAR|TAHAP|TIPE|PERTANYAAN|KUNCI|POIN|ALASAN|BUKTI|RUBRIK';
  const keyRe=new RegExp('^\\s*(?:[-*]\\s*)?('+KEYS+')\\s*[:：]\\s*(.*)$','i');
  const optRe=/^\s*(?:[-*]\s*)?([A-Ea-e])\s*[:.)]\s+(.*)$/;
  const markRe=/^\s*(?:#+|=+|-{3,})?\s*(KASUS|SOAL)\s*\d*\s*(?:#+|=+|-{3,})?\s*:?\s*$/i;
  for(const line of lines){
    if(svgBuf!==null){svgBuf+='\n'+line;if(/<\/svg>/i.test(line)){c.svg=svgBuf;svgBuf=null;field=null}continue}
    const mk=line.match(markRe);
    if(mk){if(mk[1].toUpperCase()==='KASUS')newCase();else newQ();continue}
    const km=line.match(keyRe);
    if(km){
      const k=km[1].toUpperCase(),v=km[2];
      const qk=['TAHAP','TIPE','PERTANYAAN','KUNCI','POIN','ALASAN','BUKTI','RUBRIK'].includes(k);
      if(qk){
        if(!q||(q._k.includes('|'+k+'|')&&(k==='TAHAP'||k==='TIPE'||k==='PERTANYAAN')))newQ();
        q._k+='|'+k+'|';
        if(k==='TAHAP'){const m=v.match(/[123]/);q.tahap='T'+(m?m[0]:1);if(/mudah/i.test(v))q.tahap='T1';if(/sedang/i.test(v))q.tahap='T2';if(/sulit/i.test(v))q.tahap='T3';field=null}
        else if(k==='TIPE'){const u=v.toUpperCase();q.tipe=/CEKLIS|CHECK|JAWABAN BANYAK/.test(u)?'CEKLIS':/ISIAN|ANGKA/.test(u)?'ISIAN':/URAIAN|ESAI|ESSAY/.test(u)?'URAIAN':/UNGGAH|UPLOAD|TAUTAN/.test(u)?'UNGGAH':'PG';field=null}
        else if(k==='PERTANYAAN'){q.tanya=v;field='tanya'}
        else if(k==='KUNCI'){q._kunci=v.trim();field=null}
        else if(k==='POIN'){q.poin=parseInt(v)||0;field=null}
        else if(k==='ALASAN'){q.alasan=/^\s*(ya|y|yes)/i.test(v);field=null}
        else if(k==='BUKTI'){q.bukti=/^\s*(ya|y|yes)/i.test(v);field=null}
        else if(k==='RUBRIK'){q.rubrik=v;field='rubrik'}
        continue;
      }
      if(!c||(k==='BAGIAN'&&c.bagian&&c.qs.length))newCase();
      if(k==='BAGIAN'){c.bagian=v.trim();field=null}
      else if(k==='TEKS'){c.kasus=v;field='kasus'}
      else if(k==='GAMBAR_DESKRIPSI'){c.imgNote=v.trim();field=null}
      else if(k==='GAMBAR'){
        if(/<svg/i.test(v)){svgBuf=v;if(/<\/svg>/i.test(v)){c.svg=svgBuf;svgBuf=null}}
        else if(v.trim()){c.imgNote=c.imgNote||v.trim()}
        field=null}
      continue;
    }
    const om=q&&line.match(optRe);
    if(om&&(q.tipe==='PG'||q.tipe==='CEKLIS')&&q._k.includes('|PERTANYAAN|')){q.opts[om[1].toUpperCase().charCodeAt(0)-65]=om[2].trim();field=null;continue}
    if(field&&q&&field!=='kasus'){q[field]+=(q[field]?'\n':'')+line.trim();continue}
    if(field==='kasus'&&c){c.kasus+=(c.kasus?'\n':'')+line;continue}
  }
  const dflt={T1:2,T2:3,T3:5};
  cases.forEach((cc,ci)=>{
    cc.kasus=cc.kasus.replace(/^\n+|\s+$/g,'');
    cc.qs.forEach((qq,qi)=>{
      const n=`Kasus ${ci+1}, soal ${qi+1}`;
      qq.tanya=qq.tanya.trim();
      const kv=(qq._kunci||'');
      if(qq.tipe==='PG'){const m=kv.toUpperCase().match(/[A-E]/);qq.kunci=m?[m[0]]:[]}
      else if(qq.tipe==='CEKLIS'){qq.kunci=[...new Set((kv.toUpperCase().match(/[A-E]/g)||[]))]}
      else if(qq.tipe==='ISIAN'){let x=kv.replace(/[^\d.,-]/g,'');if(/^\d{1,3}(\.\d{3})+$/.test(x))x=x.replace(/\./g,'');qq.isi=x}
      if(!qq.poin)qq.poin=qq.tipe==='URAIAN'?Math.max(5,dflt[qq.tahap]):dflt[qq.tahap];
      if(!qq.tanya)warns.push(n+': pertanyaan kosong.');
      if((qq.tipe==='PG'||qq.tipe==='CEKLIS')&&!qq.kunci.length)warns.push(n+': kunci tidak terbaca, pilih sendiri setelah ditambahkan.');
      delete qq._k;delete qq._kunci;delete qq._set;
    });
    if(cc.imgNote&&!cc.svg)warns.push(`Kasus ${ci+1}: gambar tidak dibuat AI (${cc.imgNote.slice(0,60)}). Unggah sendiri setelah ditambahkan.`);
  });
  return {cases:cases.filter(x=>x.qs.length),warns};
}
function svgToImg(svg){
  return new Promise((res,rej)=>{
    let s=svg.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi,'');
    if(!/xmlns=/.test(s))s=s.replace(/<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');
    let w=600,h=360;const vb=s.match(/viewBox\s*=\s*["']\s*[-\d.]+[ ,]+[-\d.]+[ ,]+([\d.]+)[ ,]+([\d.]+)/i);
    if(vb){w=parseFloat(vb[1]);h=parseFloat(vb[2])}
    else{const mw=s.match(/<svg[^>]*\swidth\s*=\s*["']([\d.]+)/i),mh=s.match(/<svg[^>]*\sheight\s*=\s*["']([\d.]+)/i);if(mw&&mh){w=parseFloat(mw[1]);h=parseFloat(mh[1])}}
    if(!(w>0&&h>0)){w=600;h=360}
    s=s.replace(/<svg([^>]*)>/i,(m,a)=>'<svg'+a.replace(/\s(width|height)\s*=\s*("[^"]*"|'[^']*')/gi,'')+` width="${w}" height="${h}">`);
    const im=new Image();
    im.onload=()=>{const sc=Math.min(2,900/w);const cv=document.createElement('canvas');cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);res({url:cv.toDataURL('image/jpeg',.9),w:cv.width,h:cv.height})};
    im.onerror=()=>rej(new Error('svg'));
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
  });
}
async function runParse(){
  const P=parseAI(S.ai.paste);
  if(!S.ai.paste.trim()){toast('Kolom hasil AI masih kosong');return}
  for(let i=0;i<P.cases.length;i++){const c=P.cases[i];if(c.svg){try{c.img=await svgToImg(c.svg)}catch(e){P.warns.push(`Kasus ${i+1}: gambar SVG dari AI tidak bisa dibaca. Unggah gambar sendiri.`)}}delete c.svg}
  PARSED=P;const o=document.getElementById('parseOut');if(o)o.innerHTML=parsedHtml();else render();
  toast(P.cases.length?'Hasil AI terbaca':'Tidak ada soal terbaca');
}
function addParsed(){
  if(!PARSED||!PARSED.cases.length)return;
  PARSED.cases.forEach(c=>{S.cases.push({id:nid(),bagian:c.bagian,kasus:c.kasus,img:c.img,qs:c.qs.map(q=>Object.assign({},q,{id:nid(),opts:q.opts.slice(),kunci:q.kunci.slice()}))})});
  const n=PARSED.cases.length;PARSED=null;S.ai.paste='';save();go(2);toast(n+' kasus ditambahkan. Periksa dan edit bila perlu.');
}
